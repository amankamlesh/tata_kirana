
spring.application.name=cart-service
server.port=${PORT:8083}

# H2 Database
spring.datasource.url=jdbc:h2:mem:cartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka
# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}

eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443

eureka.instance.home-page-url=https://${RENDER_EXTERNAL_HOSTNAME:localhost}/
eureka.instance.status-page-url=https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/info
eureka.instance.health-check-url=https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/health

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


logging.level.com.tcs.grocery_cart_service.client.ProductClient=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG